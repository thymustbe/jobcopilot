name: Daily Job Ingestion Engine

on:
  schedule:
    # Runs every day at 8:00 AM UTC (3:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Job Ingestion (JobSpy + LinkedIn Recruiter Scraper)
        env:
          NEXT_PUBLIC_GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          python3 scripts/jobspy_ingest.py

      - name: Commit updated seed listings (if any)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/seed_jobs.json
          git commit -m "chore(data): auto-update job listings [skip ci]" || echo "No new listings found"
          git push || echo "No changes to push"

